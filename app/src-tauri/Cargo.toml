[package]
name = "mondig"
description = "Mondig: soevereine dicteer- en transcriptie-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "mondig_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mondig-core = { path = "../../crates/mondig-core", features = ["bewaren", "download", "opname", "taalmodel"] }
# Mondig op de Mac (mijlpaal M1): plakken, rechten, de pil, geluid en wakker houden. Overal een
# afhankelijkheid: de gedeelde typen en beslissingen zitten er ook buiten de Mac in, voor de tests.
mondig-mac = { path = "../../crates/mondig-mac" }
serde = { version = "1.0.229", features = ["derive"] }
# De laatste controle als JSON-waarde in de instellingen; serde_json zat al in de boom (tauri).
serde_json = "1.0.154"
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-single-instance = "2"
tauri-plugin-store = "2.5.0"
# Atomair opslaan (ADR 0017): een tijdelijk bestand in dezelfde map, dan hernoemen met of zonder
# vervangen (persist en persist_noclobber).
tempfile = "3.27.0"

# Slepen vanuit Dictafoon, Foto's en Mail op de Mac (ADR 0030): de haak voor bestandsbeloftes.
[target.'cfg(target_os = "macos")'.dependencies]
mondig-mac-slepen = { path = "../../crates/mondig-mac-slepen" }

# Plakken op Windows (sprint 3c): klembord met delayed rendering, Ctrl+V via SendInput en
# de controle op beheerrechten. Sprint 3d: de pil zonder activering, het geluidje
# (PlaySoundW) en de privacy-schakelaars van de microfoon. Dicteren overal: UI Automation (Com,
# Accessibility) om te zien of er een tekstveld de focus heeft voordat Mondig typt. Dezelfde
# versie die cpal en tao al gebruiken.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
