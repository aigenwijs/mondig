# cargo-deny: licenties, kwetsbaarheden en bronnen van Rust-afhankelijkheden.
# Elke uitzondering hieronder
# krijgt een reden en een datum en wordt per kwartaal herzien.

[graph]
# Alleen de platforms waarvoor we bouwen, zodat de check geen crates voor
# andere doelen meeweegt.
targets = [
  "x86_64-pc-windows-msvc",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
]

[licenses]
# Alleen permissieve licenties; geen GPL, LGPL of AGPL.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "MPL-2.0",
  "Unicode-3.0",
  "0BSD",
  "BlueOak-1.0.0",
  # Mozilla-rootcertificaten in webpki-roots (via ureq, feature download); permissieve datalicentie.
  # Toegevoegd 31-10-2026 (fase 2a), per kwartaal herzien.
  "CDLA-Permissive-2.0",
  # Lettertypen Sora en Geist via Fontsource (ADR 0010). Toegevoegd 01-11-2026, per kwartaal herzien.
  "OFL-1.1",
]

[licenses.private]
# Onze eigen crates (publish = false, EUPL-1.2, ADR 0029) hoeven niet door de lijst hieronder.
ignore = true

[advisories]
# Onderhoudsmeldingen tellen alleen voor directe afhankelijkheden van onze crates.
unmaintained = "workspace"
yanked = "deny"
# Uitzonderingen: alleen als inline tabel met id en reden (met datum).
ignore = []

[bans]
# Tauri trekt veel dubbele versies binnen; waarschuwen is genoeg.
multiple-versions = "warn"
# Geen telemetrie of analytics (ADR 0003). Zelfde lijst als scripts/geen-telemetrie.mjs.
deny = [
  { name = "posthog-rs", reason = "telemetrie (ADR 0003)" },
  { name = "sentry", reason = "externe crashrapportage (ADR 0003)" },
  { name = "tauri-plugin-aptabase", reason = "analytics (ADR 0003)" },
  { name = "aptabase", reason = "analytics (ADR 0003)" },
  { name = "mixpanel", reason = "analytics (ADR 0003)" },
  { name = "segment", reason = "analytics (ADR 0003)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
