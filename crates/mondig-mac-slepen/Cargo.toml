[package]
name = "mondig-mac-slepen"
description = "Mondig op de Mac: bestandsbeloftes aannemen bij slepen naar het hoofdvenster (ADR 0030)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

# Een eigen crate, zodat de Mac-code op Windows te controleren is met
# `cargo check -p mondig-mac-slepen --target aarch64-apple-darwin`, zonder de hele app (met de
# C++-engine) voor de Mac te bouwen. Op andere platforms bevat hij alleen de gedeelde typen.
# Dezelfde versies die wry al in de boom heeft (Cargo.lock), allemaal MIT.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "block2",
  "NSDragging",
  "NSFilePromiseReceiver",
  "NSPasteboard",
  "NSResponder",
  "NSView",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "block2",
  "NSArray",
  "NSDictionary",
  "NSError",
  "NSOperation",
  "NSString",
  "NSURL",
] }

[lints]
workspace = true
