[package]
name = "mondig-engine"
description = "Werkproces van Mondig: draait de spraakengine los van de app (ADR 0009)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Het nep-werkproces voor de supervisortests. Standaard uit, zodat het niet in een
# releasebuild terechtkomt. Tests draaien daarom met `--all-features` (of `--features nep`).
nep = []

[[bin]]
name = "nep-engine"
path = "src/bin/nep-engine.rs"
required-features = ["nep"]

[[test]]
name = "supervisor"
required-features = ["nep"]

[[test]]
name = "beheer"
required-features = ["nep"]

[[test]]
name = "sporen"
required-features = ["nep"]

[dependencies]
mondig-core = { path = "../mondig-core" }

# De spraakmotor is transcribe.cpp (ggml, ADR 0011). Windows (x86-64) en Linux laden de
# rekenmodules los (`dynamic-backends`): de processormodules altijd, Vulkan alleen als het
# werkproces erom vraagt. Zo laadt bij een terugval op de processor de videodriver niet
# eens. De Mac (Apple-chip) linkt Metal statisch. De rest (Mac Intel, Windows op ARM)
# draait statisch alleen op de processor.
[target.'cfg(any(all(windows, target_arch = "x86_64"), target_os = "linux"))'.dependencies]
transcribe-cpp = { version = "=0.4.1", default-features = false, features = ["dynamic-backends", "vulkan"] }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
transcribe-cpp = { version = "=0.4.1", default-features = false, features = ["metal"] }

[target.'cfg(not(any(all(windows, target_arch = "x86_64"), target_os = "linux", all(target_os = "macos", target_arch = "aarch64"))))'.dependencies]
transcribe-cpp = { version = "=0.4.1", default-features = false }

[lints]
workspace = true

[dev-dependencies]
hound = "3.5.1"
tempfile = "3.27.0"
# Voor het meetexample `sprekers-meting` (referentie en uitvoer als JSON). Staat al in de boom via mondig-core.
serde_json = "1.0.154"
